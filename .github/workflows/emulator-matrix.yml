name: emulator-matrix-test

on:
  workflow_dispatch:

jobs:
  avd-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: oneplus-15t
            width: 2640
            height: 1216
            density: 460
            api: 35
          - device: oneplus-ace5
            width: 2780
            height: 1264
            density: 450
            api: 35
          # ---- 兼容性拉开差距矩阵（R23 起生效） ----
          - device: small-720p          # 小屏低配：最低分辨率+低密度
            width: 720
            height: 1600
            density: 280
            api: 35
          - device: tablet-10           # 大屏平板：横屏大分辨率+低密度
            width: 2560
            height: 1600
            density: 320
            api: 35
          - device: fold-inner          # 折叠屏内屏：近方形比例
            width: 2208
            height: 1768
            density: 420
            api: 35
          # legacy-api30（Android 11）已移出矩阵：2026-11-12 老板定——不再考虑；
          # 记档：该环境启动即原生崩溃（非法指令），复现 2/2，冻案待真机有需要时再启
    name: avd-${{ matrix.device }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system image
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 > /dev/null || true
          yes | sdkmanager --licenses > /dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-${{ matrix.api }};google_apis;x86_64" "platform-tools" "emulator" > /dev/null
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          adb version
          emulator -version | head -1

      - name: Create AVD (device-level approximation)
        run: |
          set -x
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n ${{ matrix.device }} -k "system-images;android-${{ matrix.api }};google_apis;x86_64" -d pixel_4a --force || true
          ls -la "$ANDROID_AVD_HOME" || true
          CFG=$(find "$ANDROID_AVD_HOME" -path "*${{ matrix.device }}.avd/config.ini" 2>/dev/null | head -1 || true)
          if [ -z "$CFG" ]; then
            mkdir -p "$ANDROID_AVD_HOME/${{ matrix.device }}.avd"
            CFG="$ANDROID_AVD_HOME/${{ matrix.device }}.avd/config.ini"
            printf 'avd.ini.encoding=UTF-8\nimage.sysdir.1=system-images/android-${{ matrix.api }}/google_apis/x86_64/\ntag.display=Android API ${{ matrix.api }}\nskin.name=pixel_4a\nskin.dynamic=yes\n' > "$CFG"
          fi
          echo "CFG=$CFG"
          sed -i '/hw.lcd.width/d;/hw.lcd.height/d;/hw.lcd.density/d' "$CFG"
          printf 'hw.lcd.width=%s\nhw.lcd.height=%s\nhw.lcd.density=%s\n' \
            "${{ matrix.width }}" "${{ matrix.height }}" "${{ matrix.density }}" >> "$CFG"
          INI="$ANDROID_AVD_HOME/${{ matrix.device }}.ini"
          if [ ! -f "$INI" ]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s/%s.avd\npath.rel=avd/%s.avd\n' "$ANDROID_AVD_HOME" "${{ matrix.device }}" "${{ matrix.device }}" > "$INI"
          fi
          echo "--- INI ---"; cat "$INI"
          cat "$CFG"
          echo "--- AVD dir ---"; ls -la "$ANDROID_AVD_HOME" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd || true
          cp "$CFG" config-dump.txt
          cp "$INI" config-dump.txt

      - name: Boot emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          ls -la /dev/kvm 2>&1 || echo "NO_KVM_DEVICE"
          sudo chmod 666 /dev/kvm 2>/dev/null || sudo usermod -aG kvm $(whoami) 2>/dev/null || true
          sudo -E kvm-ok 2>/dev/null || true
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          emulator -version | head -1
          adb start-server || true
          adb devices
          emulator -avd ${{ matrix.device }} -no-window -no-audio -no-boot-anim -gpu swiftshader-indirect -no-snapshot -camera-back none -camera-front none > emulator.log 2>&1 &
          EMUPID=$!
          echo "EMU_PID=$EMUPID"
          BOOT_OK=0
          for i in $(seq 1 90); do
            if ! kill -0 "$EMUPID" 2>/dev/null; then echo "EMULATOR_DIED"; tail -40 emulator.log; break; fi
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "boot completed at iter $i"; BOOT_OK=1; break; fi
            sleep 10
          done
          echo "BOOT_OK=$BOOT_OK"
          adb devices || true
          [ "$BOOT_OK" = "1" ] || { echo "=== emulator.log tail ==="; tail -60 emulator.log; exit 1; }

      - name: Install APK
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb devices
          adb install -r -t -g TaoPlay-130.apk
          for P in android.permission.READ_MEDIA_VIDEO android.permission.READ_MEDIA_IMAGES android.permission.READ_MEDIA_AUDIO android.permission.READ_EXTERNAL_STORAGE android.permission.POST_NOTIFICATIONS; do adb shell pm grant com.allplayer.phone $P || true; done
          adb shell screenrecord --time-limit 10 /sdcard/Movies/taoplay_test.mp4 || true
          sleep 2
          adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Movies/taoplay_test.mp4 || true
          sleep 3
          adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Movies/taoplay_test.mp4 || true
          adb shell ls -la /sdcard/Movies/ || true
          # R25 坑：扫描广播不保证及时入媒体库，轮询确认，未入就补发广播重试
          for i in $(seq 1 12); do
            if adb shell "content query --uri content://media/external/video/media --projection _display_name" 2>/dev/null | grep -q taoplay_test; then echo "MEDIA_INDEXED iter $i"; break; fi
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Movies/taoplay_test.mp4 >/dev/null 2>&1 || true
            sleep 5
          done
          adb shell uiautomator dump || true
          WAITB=$(sed -n 's/.*text="Wait"[^>]*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p' /sdcard/window_dump.xml | head -1)
          if [ -n "$WAITB" ]; then
            set -- $WAITB
            adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 )) || true
          fi
          sleep 5
          adb shell "content query --uri content://media/external/video/media --projection _display_name" || true
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          echo "AAPT2=$AAPT2"
          PKG=$("$AAPT2" dump badging TaoPlay-130.apk | head -1 | grep -oP "package: name='\K[^']+")
          if [ -z "$PKG" ] || [ "$PKG" = "TaoPlay-130.apk" ]; then echo "PKG_EXTRACT_FAILED"; "$AAPT2" dump badging TaoPlay-130.apk | head -3; exit 1; fi
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "package: $PKG"

      - name: Launch and capture UI
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          CX=$(( ${{ matrix.width }} / 2 ))
          CY=$(( ${{ matrix.height }} / 2 ))
          echo "CENTER=$CX,$CY"
          adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Movies/taoplay_test.mp4 >/dev/null 2>&1 || true
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
          sleep 25
          tap_text() {
            local B=$(sed -n "s/.*text=\"$2\"[^>]*bounds=\"\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]\".*/\1 \2 \3 \4/p" "$1" | head -1)
            if [ -n "$B" ]; then set -- $B; adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 )) || true; return 0; fi
            return 1
          }
          dump_pull() { adb shell uiautomator dump >/dev/null 2>&1 || true; adb pull /sdcard/window_dump.xml "$1" >/dev/null 2>&1 || true; }
          for i in 1 2 3; do
            dump_pull /tmp/d.xml
            tap_text /tmp/d.xml "Wait" && sleep 3 || break
          done
          for i in 1 2 3; do
            dump_pull /tmp/d.xml
            tap_text /tmp/d.xml "Got it" && sleep 2 || break
          done
          dump_pull home_dump.xml
          adb exec-out screencap -p > home_${{ matrix.device }}.png
          echo "--- home dump texts ---"
          grep -oP 'text="[^"]+"' home_dump.xml | sort -u || true
          if grep -q "没找到视频" home_dump.xml; then echo "TP-M01 WARN: home library empty"; fi
          # open player the real user way: tap the video card in the list
          COORDS=$(sed -n 's/.*taoplay_test[^"]*"[^>]*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p' home_dump.xml | head -1)
          echo "ITEM_COORDS=$COORDS"
          if [ -n "$COORDS" ]; then
            set -- $COORDS
            adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 )) || true
          else
            adb shell am start -a android.intent.action.VIEW -d "file:///sdcard/Movies/taoplay_test.mp4" -t "video/*" -p "$PKG" || true
          fi
          # 周期性落 Java 堆栈: ANR 到系统杀进程窗口太短, 发作前最后一份即真账
          ( while :; do
              P=$(adb shell pidof "$PKG" | tr -d '\r')
              if [ -n "$P" ]; then adb shell kill -3 "$P" >/dev/null 2>&1 || true; sleep 2; adb pull /data/anr/traces.txt "/tmp/jstack_${{ matrix.device }}_$(date +%s).txt" >/dev/null 2>&1 || true; fi
              sleep 8
            done ) &
          CAP_PID=$!
          sleep 12
          dump_pull after_tap_dump.xml
          if grep -q "com.google.android.apps.photos" after_tap_dump.xml; then
            echo "PHOTOS_INTERCEPTED: forcing TaoPlay player"
            adb shell am start -a android.intent.action.VIEW -d "file:///sdcard/Movies/taoplay_test.mp4" -t "video/*" -p "$PKG" || true
            sleep 8
            dump_pull after_tap_dump.xml
          fi
          # player open may block the main thread and raise ANR: keep tapping Wait so the app survives, up to 90s
          for i in $(seq 1 18); do
            dump_pull /tmp/d.xml
            if tap_text /tmp/d.xml "Wait"; then
              echo "ANR wait dismissed at loop $i"
              # Java 级堆栈: ANR 对话框在屏时先给应用发 SIGQUIT 让 ART 落完整 Java 堆栈到 /data/anr, 再拉走
              APID=$(adb shell pidof "$PKG" | tr -d '\r')
              if [ -n "$APID" ]; then adb shell kill -3 "$APID" >/dev/null 2>&1 || true; sleep 3; fi
              adb pull /data/anr anr_traces >/dev/null 2>&1 || true
              adb shell dumpsys meminfo "$PKG" > meminfo_anr.txt 2>&1 || true
              sleep 4
              continue
            fi
            if grep -qP 'text="[0-9]{1,4}[PK]' /tmp/d.xml; then
              echo "player controls visible at loop $i"
              break
            fi
            sleep 4
          done
          for i in 1 2 3; do
            dump_pull /tmp/d.xml
            tap_text /tmp/d.xml "Got it" && sleep 2 || break
          done
          # reveal controls and screenshot BEFORE they auto-hide
          adb shell input tap $CX $CY || true
          sleep 1
          adb exec-out screencap -p > player_${{ matrix.device }}.png
          dump_pull player_dump.xml
          echo "--- player dump texts (tap1) ---"
          grep -oP '(text|content-desc)="[^"]+"' player_dump.xml | sort -u || true
          adb shell input tap $CX $CY || true
          sleep 1
          dump_pull after_tap_dump.xml
          echo "--- player dump texts (tap2) ---"
          grep -oP '(text|content-desc)="[^"]+"' after_tap_dump.xml | sort -u || true
          kill $CAP_PID 2>/dev/null || true
          mkdir -p jstacks && cp /tmp/jstack_${{ matrix.device }}_*.txt jstacks/ 2>/dev/null || true
          echo "JSTACK_COUNT=$(ls jstacks/ 2>/dev/null | wc -l)"
          adb shell logcat -d > logcat_${{ matrix.device }}.txt
          echo "FATAL_COUNT=$(grep -c 'FATAL EXCEPTION' logcat_${{ matrix.device }}.txt || true)"

      - name: Verify acceptance points
        run: |
          FAIL=0
          if grep -q "com.google.android.apps.photos" player_dump.xml after_tap_dump.xml 2>/dev/null; then echo "PLAYER WRONG APP: Photos intercepted"; FAIL=1; else echo "PLAYER_OK: TaoPlay player captured"; fi
          if grep -q "辅助" player_dump.xml after_tap_dump.xml 2>/dev/null; then echo "TP-M02 FAIL: assist button present"; FAIL=1; else echo "TP-M02 PASS: no assist button in player controls"; fi
          Q=$(grep -hoP 'text="[0-9]{1,4}[PK][^"]*"' player_dump.xml after_tap_dump.xml 2>/dev/null | head -5)
          if [ -n "$Q" ]; then echo "TP-M03 PASS: quality row found: $Q"; else echo "TP-M03 FAIL: quality row text not found"; FAIL=1; fi
          echo "ACCEPTANCE_FAIL=$FAIL"
          [ "$FAIL" = "0" ] || exit 1

      - name: Collect ANR traces
        if: always()
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb root >/dev/null 2>&1 || true
          sleep 3
          adb wait-for-device >/dev/null 2>&1 || true
          adb shell "ls -la /data/anr/" > anr_listing.txt 2>&1 || true
          adb pull /data/anr anr_traces >/dev/null 2>&1 || true
          # v3.25.32: 应用内置现场记录仪 (主线程卡死自落账), 内外部私有目录都拉
          adb pull /data/data/com.allplayer.phone/files/anr_watchdog anr_watchdog_internal >/dev/null 2>&1 || true
          adb pull /storage/emulated/0/Android/data/com.allplayer.phone/files/anr_watchdog anr_watchdog >/dev/null 2>&1 || true
          ls anr_watchdog/ anr_watchdog_internal/ 2>/dev/null || echo "(no watchdog files)"
          adb shell dumpsys activity processes > dumpsys_processes.txt 2>&1 || true
          echo "ANR traces:"; ls anr_traces/ 2>/dev/null || echo "(pull failed)"

      - name: Upload boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-diag-${{ matrix.device }}
          path: |
            emulator.log
            config-dump.txt
          if-no-files-found: warn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.device }}
          path: |
            home_${{ matrix.device }}.png
            home_dump.xml
            after_tap_dump.xml
            player_${{ matrix.device }}.png
            player_dump.xml
            logcat_${{ matrix.device }}.txt
            emulator.log
            anr_listing.txt
            anr_traces/
            jstacks/
            dumpsys_processes.txt
            meminfo_anr.txt
          if-no-files-found: warn
