name: emulator-matrix-test

on:
  workflow_dispatch:

jobs:
  avd-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: oneplus-15t
            width: 2640
            height: 1216
            density: 460
            api: 35
          - device: oneplus-ace5
            width: 2780
            height: 1264
            density: 450
            api: 35
    name: avd-${{ matrix.device }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system image
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 > /dev/null || true
          yes | sdkmanager --licenses > /dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-${{ matrix.api }};google_apis;x86_64" "platform-tools" "emulator" > /dev/null
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          adb version
          emulator -version | head -1

      - name: Create AVD (device-level approximation)
        run: |
          set -x
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n ${{ matrix.device }} -k "system-images;android-${{ matrix.api }};google_apis;x86_64" -d pixel_4a --force || true
          ls -la "$ANDROID_AVD_HOME" || true
          CFG=$(find "$ANDROID_AVD_HOME" -path "*${{ matrix.device }}.avd/config.ini" 2>/dev/null | head -1 || true)
          if [ -z "$CFG" ]; then
            mkdir -p "$ANDROID_AVD_HOME/${{ matrix.device }}.avd"
            CFG="$ANDROID_AVD_HOME/${{ matrix.device }}.avd/config.ini"
            printf 'avd.ini.encoding=UTF-8\nimage.sysdir.1=system-images/android-${{ matrix.api }}/google_apis/x86_64/\ntag.display=Android API ${{ matrix.api }}\nskin.name=pixel_4a\nskin.dynamic=yes\n' > "$CFG"
          fi
          echo "CFG=$CFG"
          sed -i '/hw.lcd.width/d;/hw.lcd.height/d;/hw.lcd.density/d' "$CFG"
          printf 'hw.lcd.width=%s\nhw.lcd.height=%s\nhw.lcd.density=%s\n' \
            "${{ matrix.width }}" "${{ matrix.height }}" "${{ matrix.density }}" >> "$CFG"
          INI="$ANDROID_AVD_HOME/${{ matrix.device }}.ini"
          if [ ! -f "$INI" ]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s/%s.avd\npath.rel=avd/%s.avd\n' "$ANDROID_AVD_HOME" "${{ matrix.device }}" "${{ matrix.device }}" > "$INI"
          fi
          echo "--- INI ---"; cat "$INI"
          cat "$CFG"
          echo "--- AVD dir ---"; ls -la "$ANDROID_AVD_HOME" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd || true
          cp "$CFG" config-dump.txt
          cp "$INI" config-dump.txt

      - name: Boot emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          ls -la /dev/kvm 2>&1 || echo "NO_KVM_DEVICE"
          sudo chmod 666 /dev/kvm 2>/dev/null || sudo usermod -aG kvm $(whoami) 2>/dev/null || true
          sudo -E kvm-ok 2>/dev/null || true
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          emulator -version | head -1
          adb start-server || true
          adb devices
          emulator -avd ${{ matrix.device }} -no-window -no-audio -no-boot-anim -gpu swiftshader-indirect -no-snapshot -camera-back none -camera-front none > emulator.log 2>&1 &
          EMUPID=$!
          echo "EMU_PID=$EMUPID"
          BOOT_OK=0
          for i in $(seq 1 90); do
            if ! kill -0 "$EMUPID" 2>/dev/null; then echo "EMULATOR_DIED"; tail -40 emulator.log; break; fi
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "boot completed at iter $i"; BOOT_OK=1; break; fi
            sleep 10
          done
          echo "BOOT_OK=$BOOT_OK"
          adb devices || true
          [ "$BOOT_OK" = "1" ] || { echo "=== emulator.log tail ==="; tail -60 emulator.log; exit 1; }

      - name: Install APK
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb devices
          adb install -r -t TaoPlay-130.apk
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          echo "AAPT2=$AAPT2"
          PKG=$("$AAPT2" dump badging TaoPlay-130.apk | head -1 | sed "s/.*package:name='\([^']*\)'.*/\1/")
          if [ -z "$PKG" ] || [ "$PKG" = "TaoPlay-130.apk" ]; then echo "PKG_EXTRACT_FAILED"; "$AAPT2" dump badging TaoPlay-130.apk | head -3; exit 1; fi
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "package: $PKG"

      - name: Launch and capture UI
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
          sleep 30
          adb shell uiautomator dump || true
          adb pull /sdcard/window_dump.xml ui_dump.xml || true
          adb exec-out screencap -p > home_${{ matrix.device }}.png
          adb shell logcat -d > logcat_${{ matrix.device }}.txt
          grep -c "FATAL EXCEPTION" logcat_${{ matrix.device }}.txt || true

      - name: Upload boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-diag-${{ matrix.device }}
          path: |
            emulator.log
            config-dump.txt
          if-no-files-found: warn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.device }}
          path: |
            home_${{ matrix.device }}.png
            ui_dump.xml
            logcat_${{ matrix.device }}.txt
            emulator.log
          if-no-files-found: warn
